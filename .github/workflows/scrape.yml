name: Scrape TwitchTracker
 
on:
  schedule:
    # Runs every day at 06:00 UTC. Adjust as you like.
    - cron: '0 6 * * *'
  workflow_dispatch:  # lets you run it manually from the Actions tab
 
permissions:
  contents: write  # needed to commit the updated JSON back to the repo
 
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
 
      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
 
      - name: Run scraper
        run: python scraper/scrape.py
 
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update leaderboards $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
